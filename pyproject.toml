[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pastapronta"
version = "1.1.0"
description = "Automação local de arquivos com prévia, duplicados e histórico reversível"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [{name = "Leonardo Santos"}]
license = "MIT"

[project.urls]
Repository = "https://github.com/LeoDevsn/pastapronta"
Issues = "https://github.com/LeoDevsn/pastapronta/issues"

[project.scripts]
pastapronta = "pasta_pronta.__main__:main"

[tool.setuptools.packages.find]
include = ["pasta_pronta*"]
