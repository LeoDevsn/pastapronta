name: Build Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install pyinstaller==6.22.3
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: PastaPronta-Windows
          path: |
            dist/PastaPronta.exe
            dist/SHA256SUMS.txt
